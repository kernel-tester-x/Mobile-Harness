name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore permanent debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: DEBUG_KEYSTORE_B64 is empty"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build bundled arm64 llama-server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp /tmp/llama-cpp
          cmake -S /tmp/llama-cpp -B /tmp/llama-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/26.1.10909125/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+fp16+dotprod" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+fp16+dotprod" \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build /tmp/llama-build --target llama-server -j4
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/llama-build/bin/llama-server app/src/main/jniLibs/arm64-v8a/libllama_server.so

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleOnlineDebug --no-daemon -PappVersionCode=$((1000 + GITHUB_RUN_NUMBER))

      - name: Print APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/online/debug/app-online-debug.apk | grep -i "SHA-256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-online-debug
          path: app/build/outputs/apk/online/debug/app-online-debug.apk

      - name: Publish Direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes || true
          gh release create latest app/build/outputs/apk/online/debug/app-online-debug.apk --title "MH Local Latest" --notes "Direct APK build #${{ github.run_number }}"
