name: Build Debug APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install SDK, NDK, and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleOnlineDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-debug-apk
          path: app/build/outputs/apk/online/debug/*.apk
